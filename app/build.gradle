import com.github.megatronking.stringfog.plugin.StringFogMode
import emx.qnn.xobt.TEYG
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id 'org.jetbrains.kotlin.android'
    id 'walle'
    id 'xml-class-guard'
    id 'android-junk-code'
    id 'stringfog'
    id 'top.niunaijun.blackobfuscator'

}
apply from: "${rootDir}/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.emx.foes.fks"
            packageCount = 46
            activityCountPerPackage = 79
            excludeActivityJavaFile = false
            otherCountPerPackage = 99
            methodCountPerClass = 21
            resPrefix = "kgi_"
            drawableCount = 190
            stringCount =  162
        }
    }
}            



// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度
    depth 2
    // 需要混淆的包或者类(匹配前面一段)
    obfClass = [
                "emx.zzes.coue", 
                "com.baidu.maps.utils"
    ]
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = ["top.niunaijun.black"]
}


stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'emx.qnn.xobt.QLV'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["emx.qnn.xobt"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new TEYG()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}


xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.gzyf.jiandangshisaotong"  : "emx.zzes.coue",
                ]
    //移动目录
    moveDir = [
           "com.lx.lxtoolsproject"   : "emx.zqfjx.aaq",
           ]
}


android {
    namespace 'com.lx.lxtoolsproject'
    compileSdk = 34


    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs'] // 确保指向正确的目录
        }
    }
    	
    defaultConfig {
        applicationId "com.syxqd.yuyifanyitong"
        minSdk 26
        targetSdk 33
        versionCode rootProject.ext.android["versionCode"]
        versionName rootProject.ext.android["versionName"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        ndk { // 设置支持的 SO 库构架，注意这里要根据你的实际情况来设置
            abiFilters   "arm64-v8a"
        }



        buildConfigField "String","PRIVATE_URL",  "\"${rootProject.ext.appConfig["privacyUrl"]}\""
        buildConfigField "String","USER_URL",  "\"${rootProject.ext.appConfig["userUrl"]}\""
    }


    signingConfigs {
        release {
            keyAlias 'yuyifanyitong'
            keyPassword '123456'
            storeFile file('yuyifanyitong.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'yuyifanyitong'
            keyPassword '123456'
            storeFile file('yuyifanyitong.jks')
            storePassword '123456'
        }
    }




    buildTypes {

        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "LOG_DEBUG", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            buildConfigField "boolean", "LOG_DEBUG", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        compose true
        buildConfig = true
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }


    dataBinding {
        enabled = true
    }

    viewBinding {
        enabled = true
    }

    buildFeatures {
        compose true
    }
    	
  walle {
        // 指定渠道包的输出路径
        apkOutputFolder = new File("${project.buildDir}/outputs/channels");
        // 定制渠道包的APK的文件名称
        apkFileNameFormat = '素页轻扫-${channel}-${buildType}-v${versionName}-${versionCode}-${buildTime}.apk';
        // 渠道配置文件
        channelFile = new File("${project.getProjectDir()}/channel/channel.txt")

    }


}

