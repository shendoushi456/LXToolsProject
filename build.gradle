// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
//    repositories {
//        google()
//        mavenCentral()
//        maven { url "https://jitpack.io" } // 必须有
//    }
    dependencies {
        classpath libs.walle.plugin
        classpath "com.github.liujingxing:XmlClassGuard:1.2.7"
        classpath "com.github.CodingGay:BlackObfuscator-ASPlugin:3.7"
        classpath "com.github.qq549631030:android-junk-code:1.1.2"

        classpath 'com.github.megatronking.stringfog:gradle-plugin:5.2.0'
        // 选用加解密算法库，默认实现了xor算法，也可以使用自己的加解密库。
        classpath 'com.github.megatronking.stringfog:xor:5.0.0'

    }
}


plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
//    alias(libs.plugins.kotlin.android) apply false
    id("com.google.devtools.ksp") version "2.2.10-2.0.2" apply false
}

apply from: "config.gradle"
apply from: "build_tools/jiagu/jiagu.gradle"
